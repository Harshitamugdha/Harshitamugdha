<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Harshita Mugdha. Backend and API engineer, competitive programmer.">
<style>
  .t { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
  .c { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.16,1,.3,1) both; }
  .w { animation: pop .55s cubic-bezier(.16,1,.3,1) both, pulse 5.5s ease-in-out infinite; }
  .cur { animation: blink 1.1s steps(1) infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .45; } }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .t, .c, .w, .cur { animation: none !important; } }
</style>
